<svg xmlns="http://www.w3.org/2000/svg" width="760" height="135" viewBox="0 0 760 135" fill="none">
  <style>
    .row1 {
      fill: #3B82F6;
      fill-opacity: 0.05;
      stroke: #60A5FA;
      stroke-width: 0.8px;
      rx: 17px;
    }
    .row2 {
      fill: #6366F1;
      fill-opacity: 0.16;
      stroke: #818CF8;
      stroke-width: 0.8px;
      rx: 17px;
    }
    .row3 {
      fill: #A855F7;
      fill-opacity: 0.30;
      stroke: #C084FC;
      stroke-width: 1.0px;
      rx: 17px;
    }
    .badge-text1 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #93C5FD;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .badge-text2 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #C7D2FE;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .badge-text3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #F3E8FF;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Fila 1: Tonos Azules -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="112" height="32" class="row1" />
    <text x="57" y="17" class="badge-text1">AWS Lambda</text>

    <rect x="120.5" y="0.5" width="108" height="32" class="row1" />
    <text x="175" y="17" class="badge-text1">API Gateway</text>

    <rect x="236.5" y="0.5" width="102" height="32" class="row1" />
    <text x="288" y="17" class="badge-text1">DynamoDB</text>

    <rect x="346.5" y="0.5" width="124" height="32" class="row1" />
    <text x="409" y="17" class="badge-text1">Step Functions</text>

    <rect x="478.5" y="0.5" width="76" height="32" class="row1" />
    <text x="517" y="17" class="badge-text1">Athena</text>

    <rect x="562.5" y="0.5" width="102" height="32" class="row1" />
    <text x="614" y="17" class="badge-text1">Amazon S3</text>

    <rect x="672.5" y="0.5" width="74" height="32" class="row1" />
