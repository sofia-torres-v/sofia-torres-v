<svg xmlns="http://www.w3.org/2000/svg" width="760" height="135" viewBox="0 0 760 135" fill="none">
  <style>
    /* Estilos por defecto (Modo Oscuro) */
    .row1 { fill: #1E293B; fill-opacity: 0.4; stroke: #38BDF8; stroke-width: 1px; rx: 17px; }
    .row2 { fill: #2E1065; fill-opacity: 0.45; stroke: #6366F1; stroke-width: 1px; rx: 17px; }
    .row3 { fill: #3B1C54; fill-opacity: 0.65; stroke: #A855F7; stroke-width: 1px; rx: 17px; }
    .text1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #E0F2FE; text-anchor: middle; dominant-baseline: central; }
    .text2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #EEF2FF; text-anchor: middle; dominant-baseline: central; }
    .text3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #F3E8FF; text-anchor: middle; dominant-baseline: central; }

    /* Adaptación automática para el Modo Claro (Light Mode) de GitHub */
    @media (prefers-color-scheme: light) {
      .row1 { fill: #E0F2FE; fill-opacity: 0.6; stroke: #0284C7; }
      .row2 { fill: #EDE9FE; fill-opacity: 0.7; stroke: #4F46E5; }
      .row3 { fill: #F3E8FF; fill-opacity: 0.8; stroke: #9333EA; }
      .text1 { fill: #0369A1; }
      .text2 { fill: #4338CA; }
      .text3 { fill: #6B21A8; }
    }
  </style>

  <!-- Fila 1: Azul Cyan -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="112" height="32" class="row1" />
    <text x="57" y="17" class="text1">AWS Lambda</text>

    <rect x="120.5" y="0.5" width="108" height="32" class="row1" />
    <text x="175" y="17" class="text1">API Gateway</text>

    <rect x="236.5" y="0.5" width="102" height="32" class="row1" />
    <text x="288" y="17" class="text1">DynamoDB</text>

    <rect x="346.5" y="0.5" width="124" height="32" class="row1" />
    <text x="409" y="17" class="text1">Step Functions</text>

    <rect x="478.5" y="0.5" width="76" height="32" class="row1" />
    <text x="517" y="17" class="text1">Athena</text>

    <rect x="562.5" y="0.5" width="102" height="32" class="row1" />
    <text x="614" y="17" class="text1">Amazon S3</text>

    <rect x="672.5" y="0.5" width="74" height="32" class="row1" />
    <text x="710" y="17" class="text1">Python</text>
  </g>

  <!-- Fila 2: Índigo / Violeta -->
  <g transform="translate(0, 46)">
    <rect x="0.5" y="0.5" width="88" height="32" class="row2" />
    <text x="45" y="17" class="text2">OpenAPI</text>

    <rect x="96.5" y="0.5" width="92" height="32" class="row2" />
    <text x="143" y="17" class="text2">AWS SAM</text>

    <rect x="196.5" y="0.5" width="134" height="32" class="row2" />
    <text x="264" y="17" class="text2">CloudFormation</text>

    <rect x="338.5" y="0.5" width="138" height="32" class="row2" />
    <text x="408" y="17" class="text2">Amazon Connect</text>

    <rect x="484.5" y="0.5" width="128" height="32" class="row2" />
    <text x="549" y="17" class="text2">Amazon Lex V2</text>
  </g>

  <!-- Fila 3: Morado Neón -->
  <g transform="translate(0, 92)">
    <rect x="0.5" y="0.5" width="138" height="32" class="row3" />
    <text x="70" y="17" class="text3">Amazon Bedrock</text>

    <rect x="146.5" y="0.5" width="166" height="32" class="row3" />
    <text x="230" y="17" class="text3">Amazon Q in Connect</text>

    <rect x="320.5" y="0.5" width="62" height="32" class="row3" />
    <text x="352" y="17" class="text3">RAG</text>
  </g>
</svg>